<body>
    <div class="wrapper">
        <header class="container">
            <span class="logo">InvestCalc <span style="color:#4CAF50; font-size:14px; vertical-align: super;">PRO</span></span>
        </header>

        <main class="container calculator-section">
            <div class="calc-info">
                <h1>Калькулятор сложного процента</h1>
                <p>Профессиональный расчет доходности с учетом налогов, инфляции и сравнением с банковским вкладом.</p>
            </div>

            <div class="calc-box">
                <!-- Левая часть: Форма -->
                <div class="calc-form">
                    <!-- ПРЕСЕТЫ УДАЛЕНЫ -->

                    <div class="input-group">
                        <label for="startSum">Начальная сумма (₽)</label>
                        <input type="text" id="startSum" value="100000" inputmode="numeric">
                    </div>
                    <div class="input-group">
                        <label for="monthlyAdd">Ежемесячное пополнение (₽)</label>
                        <input type="text" id="monthlyAdd" value="10000" inputmode="numeric">
                    </div>
                    
                    <div class="input-group">
                        <label for="years">Срок (лет)</label>
                        <input type="number" id="years" value="10" min="1" max="50">
                    </div>
                    <div class="input-group">
                        <label for="rate">Доходность (% годовых)</label>
                        <input type="number" id="rate" value="12" min="0" max="100" step="0.1">
                    </div>
                    <div class="input-group">
                        <label for="inflation">Инфляция (% годовых)</label>
                        <input type="number" id="inflation" value="6" min="0" max="50" step="0.1">
                    </div>
                    
                    <div class="toggles">
                        <label class="toggle-switch">
                            <input type="checkbox" id="taxCheck">
                            <span class="slider"></span>
                            <span class="toggle-label">Учитывать налог (13%)</span>
                        </label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="depositCheck" checked>
                            <span class="slider"></span>
                            <span class="toggle-label">Добавить график банковского вклада (10%)</span>
                        </label>
                    </div>

                    <button id="calcBtn" class="btn">Рассчитать</button>
                </div>

                <!-- Правая часть: Результаты -->
                <div class="calc-result">
                    <h2>Результат</h2>
                    <div class="result-card">
                        <span>Вложено вами:</span>
                        <span id="investedResult">0 ₽</span>
                    </div>
                    <div class="result-card">
                        <span>Налог (13%):</span>
                        <span id="taxResult" class="tax-text">0 ₽</span>
                    </div>
                    <div class="result-card">
                        <span>Чистая прибыль:</span>
                        <span id="profitResult" class="profit-text">0 ₽</span>
                    </div>
                    <div class="result-card">
                        <span>Итоговый капитал:</span>
                        <span id="totalResult" class="total-text">0 ₽</span>
                    </div>
                    <div class="result-card highlight-inflation">
                        <span>Реальная сумма (с учетом инфляции):</span>
                        <span id="realResult">0 ₽</span>
                    </div>
                
                </div>
            </div>

            <!-- Блок с графиком -->
            <div class="chart-container">
                <h2>Динамика роста капитала</h2>
                <canvas id="myChart"></canvas>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
